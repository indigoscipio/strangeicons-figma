<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --border: #e8e8e4;
      --border-hover: #c8c8c0;
      --text-primary: #1a1a18;
      --text-muted: #8a8a80;
      --text-subtle: #b8b8b0;
      --accent: #1a1a18;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      border-bottom-right-radius: var(--radius-lg);
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .version-badge {
      font-size: 10px;
      font-weight: 500;
      color: var(--text-primary);
      border: 1px solid var(--accent);
      border-top-left-radius: var(--radius-sm);
      padding: 1px 4px;
      line-height: 1.3;
      margin-left: auto;
    }
    .filters {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .filter-row {
      display: flex;
      gap: 6px;
    }
    .filters select {
      flex: 1;
      padding: 6px 8px;
      font-size: 12px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 0 var(--radius-md) 0 0;
      background: var(--surface);
      color: var(--text-primary);
      cursor: pointer;
      appearance: auto;
      transition: border-color 0.12s;
    }
    .filters select:focus { outline: none; border-color: var(--accent); }
    .filters select:hover { border-color: var(--border-hover); }
    #search {
      padding: 6px 8px;
      font-size: 12px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 0 var(--radius-md) 0 0;
      background: var(--surface);
      color: var(--text-primary);
      transition: border-color 0.12s;
    }
    #search:focus { outline: none; border-color: var(--accent); }
    #search::placeholder { color: var(--text-subtle); }
    #loading, #error, #empty {
      padding: 32px 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
    #error { color: #c0392b; }
    #icon-grid {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
      align-content: start;
      gap: 3px;
    }
    .icon-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 0 0 var(--radius-lg) 0;
      cursor: pointer;
      border: 1px solid transparent;
      transition: border-color 0.12s, box-shadow 0.12s, transform 0.1s, background 0.12s;
      min-height: 40px;
      background: transparent;
      user-select: none;
    }
    .icon-cell:hover {
      background: var(--surface);
      border-color: var(--border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      transform: translateY(-1px);
    }
    .icon-cell.selected {
      background: var(--surface);
      border-color: var(--accent);
    }
    .icon-cell svg {
      width: 20px;
      height: 20px;
      display: block;
      flex-shrink: 0;
      pointer-events: none;
    }
    .footer {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 12px;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .footer-copy {
      font-size: 11px;
      color: var(--text-subtle);
    }
    .footer-links {
      display: flex;
      gap: 10px;
      margin-left: auto;
    }
    .footer-links a {
      font-size: 11px;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.12s;
    }
    .footer-links a:hover { color: var(--text-primary); }
    #resize-handle {
      position: absolute;
      right: 2px;
      bottom: 2px;
      width: 18px;
      height: 18px;
      cursor: nwse-resize;
      z-index: 10;
      opacity: 0.6;
      transition: opacity 0.12s;
    }
    #resize-handle:hover { opacity: 1; }
    #resize-handle svg { display: block; }
    #icon-grid::-webkit-scrollbar { width: 6px; }
    #icon-grid::-webkit-scrollbar-track { background: transparent; }
    #icon-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    #icon-grid::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }
  </style>
</head>
<body>
  <div class="header">
    <h1>Strange Icons</h1>
    <span class="version-badge">v3.1</span>
  </div>

  <div class="filters">
    <div class="filter-row">
      <select id="family-select"></select>
      <select id="style-select"></select>
    </div>
    <input type="text" id="search" placeholder="Search icons..." />
  </div>

  <div id="loading">Loading icons...</div>
  <div id="error" style="display:none"></div>
  <div id="empty" style="display:none">No icons found</div>

  <div id="sprite-sheet" style="display:none"></div>
  <div id="icon-grid"></div>

  <div class="footer">
    <span class="footer-copy">&copy; 2026 strangeicons</span>
    <nav class="footer-links">
      <a href="https://strangeicons.com" target="_blank">Website</a>
      <a href="https://github.com/indigoscipio/strangeicons-v3" target="_blank">GitHub</a>
      <a href="https://opensource.org/license/mit" target="_blank">License</a>
    </nav>
  </div>

  <div id="resize-handle">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M18 0v18H0l18-18z" fill="var(--surface)" />
      <path d="M7 18H3L18 3v4l-11 11z" fill="var(--text-muted)" />
      <path d="M13 18H9L18 9v4l-5 5z" fill="var(--text-muted)" />
    </svg>
  </div>

  <script>
    const BASE = "https://strangeicons.com";
    const FAMILIES = ["asklepios", "freud", "nightingale", "osler", "sandow", "turing"];
    const STYLES = ["bold", "duoline", "duotone", "fill", "light", "regular"];

    let icons = [];
    let currentFamily = FAMILIES[0];
    let currentStyle = STYLES[0];
    let spriteCache = {};
    let selectedCell = null;

    const familySelect = document.getElementById("family-select");
    const styleSelect = document.getElementById("style-select");
    const searchInput = document.getElementById("search");
    const iconGrid = document.getElementById("icon-grid");
    const spriteSheet = document.getElementById("sprite-sheet");
    const loadingEl = document.getElementById("loading");
    const errorEl = document.getElementById("error");
    const emptyEl = document.getElementById("empty");

    FAMILIES.forEach(function (f) {
      var opt = document.createElement("option");
      opt.value = f;
      opt.textContent = f.charAt(0).toUpperCase() + f.slice(1);
      familySelect.appendChild(opt);
    });

    STYLES.forEach(function (s) {
      var opt = document.createElement("option");
      opt.value = s;
      opt.textContent = s.charAt(0).toUpperCase() + s.slice(1);
      styleSelect.appendChild(opt);
    });

    function show(el) { if (el) el.style.display = ""; }
    function hide(el) { if (el) el.style.display = "none"; }

    function setLoading(v) {
      if (v) { show(loadingEl); hide(errorEl); hide(emptyEl); }
      else { hide(loadingEl); }
    }

    function setError(msg) {
      if (msg) {
        errorEl.textContent = msg;
        show(errorEl);
        hide(loadingEl);
        hide(emptyEl);
      } else {
        hide(errorEl);
      }
    }

    function setEmpty(v) {
      if (v) { show(emptyEl); hide(loadingEl); hide(errorEl); }
      else { hide(emptyEl); }
    }

    async function fetchJSON(url) {
      var res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    async function fetchSprite(family, style) {
      var key = family + "-" + style;
      if (spriteCache[key]) return spriteCache[key];
      var url = BASE + "/sprites/" + key + ".svg";
      var res = await fetch(url);
      if (!res.ok) throw new Error("HTTP " + res.status);
      var text = await res.text();
      spriteCache[key] = text;
      return text;
    }

    function injectSymbols(family, style) {
      var key = family + "-" + style;
      var svgText = spriteCache[key];
      if (!svgText) return;
      var parser = new DOMParser();
      var doc = parser.parseFromString(svgText, "image/svg+xml");
      var symbols = doc.querySelectorAll("symbol");
      spriteSheet.innerHTML = "";
      symbols.forEach(function (sym) {
        spriteSheet.appendChild(sym.cloneNode(true));
      });
    }

    function getSvgSource(family, style, name) {
      var id = family + "/" + style + "/" + name;
      var kids = spriteSheet.children;
      for (var i = 0; i < kids.length; i++) {
        if (kids[i].getAttribute("id") === id) {
          return '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">' +
            kids[i].innerHTML + "</svg>";
        }
      }
      return null;
    }

    function insertIcon(family, style, name) {
      var svg = getSvgSource(family, style, name);
      if (svg) {
        parent.postMessage({ pluginMessage: { type: "insert-icon", svg: svg } }, "*");
      }
    }

    function renderGrid() {
      var q = searchInput.value.toLowerCase().trim();
      var filtered = icons.filter(function (ic) { return ic.family === currentFamily; });
      if (q) {
        filtered = filtered.filter(function (ic) { return ic.name.includes(q); });
      }
      if (!filtered.length) {
        iconGrid.innerHTML = "";
        setEmpty(true);
        return;
      }
      setEmpty(false);
      injectSymbols(currentFamily, currentStyle);

      var html = "";
      for (var i = 0; i < filtered.length; i++) {
        var ic = filtered[i];
        html += '<div class="icon-cell" draggable="true" data-name="' + ic.name + '" title="' + ic.name + '">';
        html += '<svg viewBox="0 0 24 24" width="20" height="20">';
        html += '<use href="#' + ic.family + '/' + currentStyle + '/' + ic.name + '"/>';
        html += '</svg>';
        html += '</div>';
      }
      iconGrid.innerHTML = html;

      var cells = iconGrid.children;
      for (var j = 0; j < cells.length; j++) {
        (function (cell) {
          cell.addEventListener("click", function () {
            if (selectedCell) selectedCell.classList.remove("selected");
            cell.classList.add("selected");
            selectedCell = cell;
            insertIcon(currentFamily, currentStyle, cell.getAttribute("data-name"));
          });
          cell.addEventListener("dragstart", function (e) {
            e.dataTransfer.setData("text/plain", cell.getAttribute("data-name"));
            cell.style.opacity = "0.6";
          });
          cell.addEventListener("dragend", function (e) {
            cell.style.opacity = "";
            var svg = getSvgSource(currentFamily, currentStyle, cell.getAttribute("data-name"));
            if (svg) {
              window.parent.postMessage({
                pluginDrop: {
                  clientX: e.clientX,
                  clientY: e.clientY,
                  items: [{ type: "image/svg+xml", data: svg }]
                }
              }, "*");
            }
          });
        })(cells[j]);
      }
    }

    async function loadIcons() {
      setLoading(true);
      try {
        icons = await fetchJSON(BASE + "/icons.json");
      } catch (e) {
        setError("Failed to load icons");
        return;
      }
      setLoading(false);
      await loadSpriteAndRender();
    }

    async function loadSpriteAndRender() {
      setLoading(true);
      try {
        await fetchSprite(currentFamily, currentStyle);
      } catch (e) {
        setError("Failed to load icons");
        return;
      }
      setLoading(false);
      renderGrid();
    }

    familySelect.addEventListener("change", function () {
      currentFamily = this.value;
      selectedCell = null;
      loadSpriteAndRender();
    });

    styleSelect.addEventListener("change", function () {
      currentStyle = this.value;
      selectedCell = null;
      loadSpriteAndRender();
    });

    searchInput.addEventListener("input", renderGrid);

    document.addEventListener("keydown", function (e) {
      if (e.key === "/" && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.key === "Escape") {
        searchInput.blur();
      }
    });

    // Resize handle
    var handle = document.getElementById("resize-handle");
    handle.addEventListener("pointerdown", function (e) {
      handle.setPointerCapture(e.pointerId);
      function onMove(ev) {
        var w = Math.max(240, Math.round(ev.clientX + 2));
        var h = Math.max(200, Math.round(ev.clientY + 2));
        parent.postMessage({ pluginMessage: { type: "resize", width: w, height: h } }, "*");
      }
      function onUp() {
        handle.removeEventListener("pointermove", onMove);
        handle.removeEventListener("pointerup", onUp);
      }
      handle.addEventListener("pointermove", onMove);
      handle.addEventListener("pointerup", onUp);
    });

    loadIcons();
  </script>
</body>
</html>
